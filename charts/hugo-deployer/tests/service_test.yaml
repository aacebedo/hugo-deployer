---
suite: service
templates:
  - service.yaml
tests:
  - it: renders a single ClusterIP-style Service named after the release
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: Service
      - equal:
          path: metadata.name
          value: RELEASE-NAME
      - equal:
          path: metadata.namespace
          value: NAMESPACE

  - it: labels the service using the labels helper
    asserts:
      - equal:
          path: metadata.labels
          value:
            app.kubernetes.io/name: hugo-deployer
            app.kubernetes.io/instance: RELEASE-NAME
            app.kubernetes.io/chart-version: 0.1.0
            app.kubernetes.io/app-version: "2.14.0"

  - it: exposes port 80 targeting the http container port and selects the app pods
    asserts:
      - equal:
          path: spec.ports[0]
          value:
            name: http
            port: 80
            protocol: TCP
            targetPort: http
      - equal:
          path: spec.selector
          value:
            app.kubernetes.io/name: hugo-deployer
            app.kubernetes.io/instance: RELEASE-NAME
