---
suite: ingress
templates:
  - ingress.yaml
tests:
  - it: renders a single Ingress named after the release
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: Ingress
      - equal:
          path: metadata.name
          value: RELEASE-NAME
      - equal:
          path: metadata.namespace
          value: NAMESPACE

  - it: omits annotations and labels by default
    asserts:
      - equal:
          path: metadata.annotations
          value: null
      - equal:
          path: metadata.labels
          value: null

  - it: renders configured annotations and labels
    set:
      ingress:
        annotations:
          kubernetes.io/ingress.class: nginx
        labels:
          team: platform
    asserts:
      - equal:
          path: metadata.annotations
          value:
            kubernetes.io/ingress.class: nginx
      - equal:
          path: metadata.labels
          value:
            team: platform

  - it: renders the configured host and path, backed by the release Service on port http
    set:
      ingress:
        host: hugo.example.com
        path: /blog
    asserts:
      - equal:
          path: spec.rules[0].host
          value: hugo.example.com
      - equal:
          path: spec.rules[0].http.paths[0].path
          value: /blog
      - equal:
          path: spec.rules[0].http.paths[0].backend.service
          value:
            name: RELEASE-NAME
            port:
              name: http
      - equal:
          path: spec.rules[0].http.paths[0].pathType
          value: ImplementationSpecific

  - it: supports templated expressions in host and path via tpl
    set:
      ingress:
        host: "{{ .Release.Name }}.example.com"
        path: "/{{ .Release.Namespace }}"
    asserts:
      - equal:
          path: spec.rules[0].host
          value: RELEASE-NAME.example.com
      - equal:
          path: spec.rules[0].http.paths[0].path
          value: /NAMESPACE

  - it: omits the tls block when tls is disabled
    asserts:
      - notExists:
          path: spec.tls

  - it: renders a tls block naming the host and a release-scoped secret when enabled
    set:
      ingress:
        host: hugo.example.com
        tls:
          enabled: true
    asserts:
      - equal:
          path: spec.tls[0]
          value:
            hosts:
              - hugo.example.com
            secretName: RELEASE-NAME-tls
