---
suite: secret
templates:
  - secrets.yaml
tests:
  - it: renders a single Opaque Secret named after the release siteconfig
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: Secret
      - equal:
          path: type
          value: Opaque
      - equal:
          path: metadata.name
          value: RELEASE-NAME-siteconfig
      - equal:
          path: metadata.namespace
          value: NAMESPACE

  - it: base64-encodes the configured credentials
    set:
      siteConfig:
        updateAPIKey: super-secret-key # checkov:skip=CKV_SECRET_6:test fixture, not a real secret
        gitToken: super-secret-token # checkov:skip=CKV_SECRET_6:test fixture, not a real secret
        gitUsername: johndoe
    asserts:
      - equal:
          path: data.UPDATE_API_KEY
          value: c3VwZXItc2VjcmV0LWtleQ==
      - equal:
          path: data.GIT_TOKEN
          value: c3VwZXItc2VjcmV0LXRva2Vu
      - equal:
          path: data.GIT_USERNAME
          value: am9obmRvZQ==

  - it: still emits base64-empty values when credentials are unset
    asserts:
      - equal:
          path: data.UPDATE_API_KEY
          value: ""
      - equal:
          path: data.GIT_TOKEN
          value: ""
      - equal:
          path: data.GIT_USERNAME
          value: ""
