---
name: Setup
description: Sets up mise and configures git
inputs:
  token:
    description: GitHub token for setting the remote URL
    required: false
  actor:
    description: GitHub username
    required: false
  repository:
    description: GitHub repository in format owner/repo
    required: false
runs:
  using: composite
  steps:
    - name: Setup mise
      uses: jdx/mise-action@v4
      with:
        bootstrap: true
        bootstrap_args: "--update"
    - name: Configure git safe directory
      shell: bash
      run: |
        git config --global --add safe.directory '*'
    - name: Configure git remote and user info
      if: ${{ inputs.token && inputs.actor && inputs.repository }}
      shell: bash
      run: |
        git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git config --global user.name "github-actions[bot]"
        git remote set-url origin \
          https://${{ inputs.actor }}:${{ inputs.token }}@github.com/${{ inputs.repository }}.git
