---
name: Prepare devcontainer image

# yamllint disable-line rule:truthy
on:
  workflow_call:
permissions: {}
jobs:
  prepare-devcontainer-image:
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0
          fetch-tags: true
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Log in to container registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push devcontainer image
        uses: docker/build-push-action@v7
        with:
          context: .devcontainer
          build-contexts: |
            workspace=${{ github.workspace }}
          secrets: |
            MISE_GITHUB_TOKEN=${{ secrets.GITHUB_TOKEN }}
          push: true
          tags: ghcr.io/${{ github.repository }}-devcontainer:${{ github.sha }}-${{github.run_id}}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.description=Development container for ${{ github.event.repository.name }}
            org.opencontainers.image.licenses=MIT
      - name: Run Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          scan-ref: ghcr.io/${{ github.repository }}-devcontainer:${{ github.sha }}-${{github.run_id}}
