---
name: PR

# yamllint disable-line rule:truthy
on:
  workflow_dispatch:
  pull_request:
    branches:
      - main

permissions: {}

jobs:
  pr-checks:
    uses: aacebedo/boilerplate-templates/.github/workflows/reusable-pr.yaml@v0.3.3
    permissions:
      contents: read
      packages: read
    with:
      container-image: ghcr.io/aacebedo/devcontainer-base:1.23.0
      container-options: >-
        --user root
        --privileged --cgroupns=host --security-opt apparmor=unconfined --device /dev/fuse

      extra-tasks: >-
        container:security-scan
