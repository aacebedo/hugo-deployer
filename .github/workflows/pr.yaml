---
name: PR

# yamllint disable-line rule:truthy
on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
permissions: {}
jobs:
  prepare:
    uses: ./.github/workflows/prepare-devcontainer-image.yaml
    permissions:
      contents: read
      packages: write

  pr-checks:
    needs: prepare
    runs-on: ubuntu-26.04
    container:
      image: ghcr.io/${{ github.repository }}-devcontainer:${{ github.sha }}-${{github.run_id}}
      options: --user root --privileged
    permissions:
      contents: read
      packages: read
      security-events: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0
          fetch-tags: true
      - name: Setup
        uses: ./.github/actions/setup
      - name: Lint
        run: mise lint
      - name: Test
        run: mise test
      - name: Security scan
        run: mise security-scan
  cleanup:
    uses: ./.github/workflows/cleanup-devcontainer-image.yaml
    permissions:
      packages: write
    needs:
      - prepare
      - pr-checks
    if: always()
