# Configuration file for `prek`, a git hook framework written in Rust.
# See https://prek.j178.dev for more information.
# :schema https://www.schemastore.org/prek.json

[[repos]]
repo = "https://github.com/hadolint/hadolint"
rev = "v2.14.0"
hooks = [{ id = "hadolint" }]

[[repos]]
repo = "https://github.com/adrienverge/yamllint"
rev = "v1.38.0"

[[repos.hooks]]
id = "yamllint"
exclude = '^.*templates/.*\.yaml'

[[repos]]
repo = "https://github.com/editorconfig-checker/editorconfig-checker"
rev = "v3.6.0"
hooks = [{ id = "editorconfig-checker" }]

[[repos]]
repo = "local"

[[repos.hooks]]
id = "biome-lint"
name = "biome lint"
entry = "biome lint --write --files-ignore-unknown=true --no-errors-on-unmatched"
language = "system"
files = '\.(js|jsx|mjs|cjs|ts|tsx|json|jsonc|css|html)$'

[[repos]]
repo = "local"

[[repos.hooks]]
id = "trivy-fs"
name = "Trivy filesystem scan"
entry = "trivy"
args = ["fs", "."]
language = "system"
pass_filenames = false

[[repos]]
repo = "https://github.com/commitizen-tools/commitizen"
rev = "v4.13.0"
hooks = [{ id = "commitizen" }]

[[repos]]
repo = "https://github.com/errata-ai/vale"
rev = "v3.14.0"
hooks = [{ id = "vale" }]

[[repos]]
repo = "local"

[[repos.hooks]]
id = "updatecli-manifest-validate"
name = "Validate Updatecli manifests"
entry = "env"
args = [
  "UPDATECLI_GITHUB_TOKEN=validate-only",
  "updatecli",
  "manifest",
  "validate",
  "--experimental",
  "--config",
  ".updatecli/manifests",
  "--values",
  ".updatecli/values.yaml",
]
language = "system"
files = '^\.updatecli/(manifests/.*\.ya?ml|values\.yaml)$'
pass_filenames = false

[[repos]]
repo = "https://github.com/rvben/rumdl-pre-commit"
rev = "v0.2.69"
hooks = [{ id = "rumdl-check" }]

[[repos]]
repo = "https://github.com/shellcheck-py/shellcheck-py"
rev = "v0.10.0.1"
hooks = [{ id = "shellcheck" }]

[[repos]]
repo = "https://github.com/scop/pre-commit-shfmt"
rev = "v3.12.0-2"
hooks = [{ id = "shfmt" }]

[[repos]]
repo = "https://github.com/gruntwork-io/pre-commit"
rev = "v0.1.30"
hooks = [{ id = "helmlint" }]

[[repos]]
repo = "https://github.com/jtyr/kubeconform-helm"
rev = "v0.2.0"
hooks = [{ id = "kubeconform-helm" }]

[[repos]]
repo = "https://github.com/bridgecrewio/checkov.git"
rev = "3.2.528"

[[repos.hooks]]
id = "checkov"
files = '(\.yaml$|Dockerfile)'
# the following args is to make the checkov generation
args = ["--skip-check", "CKV_K8S_21"]

[[repos]]
repo = "local"

[[repos.hooks]]
id = "cog-check"
name = "cog check"
entry = "cog"
args = ["check", "--from-latest-tag"]
language = "system"
pass_filenames = false
stages = ["pre-push"]

[[repos]]
repo = "local"

[[repos.hooks]]
id = "dprint"
name = "dprint check"
entry = "dprint check"
language = "system"
files = '\.(json|jsonc|ya?ml|md|toml)$|(^|/)Dockerfile$|\.dockerfile$'
pass_filenames = false

[[repos]]
repo = "local"

[[repos.hooks]]
id = "codebook"
name = "codebook spell check"
entry = "codebook-lsp lint"
language = "system"
files = '\.(md|toml|ya?ml|json|jsonc|sh)$|(^|/)Dockerfile$|\.dockerfile$'
